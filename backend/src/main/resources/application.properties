spring.application.name=Backend

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#KEYCLOAK CONFIG

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KCK_URL}/realms/${KCK_REALM}/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KCK_PUBLIC_URL}/realms/${KCK_REALM}

jwt.auth.converter.principle-atribute=preferred_username
jwt.auth.converter.resource-id=spring-client-api-rest

logging.level.org.keycloak=DEBUG