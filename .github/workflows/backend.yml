name: Backend - Docker

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'backend/**' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generar JAR sin tests
        working-directory: ./backend 
        run: mvn clean package -DskipTests

      - name: Subir JAR como artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-backend-jar
          path: backend/target/mi-backend.jar 

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ejecutar pruebas unitarias
        working-directory: ./backend
        run: mvn test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar JAR generado
        uses: actions/download-artifact@v4
        with:
          name: mi-backend-jar
          path: backend/target 

      - name: Construir imagen Docker
        working-directory: ./backend
        run: docker build -t nicolasmeza/mi-backend .

      - name: Guardar imagen Docker como archivo
        run: docker save nicolasmeza/mi-backend -o backend_image.tar

      - name: Subir imagen Docker como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend_image.tar

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Descargar imagen Docker
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image
          path: .

      - name: Cargar imagen Docker
        run: docker load -i backend_image.tar

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Subir imagen a Docker Hub
        run: docker push nicolasmeza/mi-backend